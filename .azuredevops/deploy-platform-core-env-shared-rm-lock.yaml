trigger:
  branches:
    include:
      - remove-locks
pr: none

parameters:
  - name: azureServiceConnection
    type: string
    default: 'AZR-ADP-SSV5'
    displayName: 'AZR-ADP-SSV5'

stages:
  - stage: RemoveLock
    displayName: 'Remove resource locks'
    jobs:
      - job: RemoveLockJob
        displayName: 'Remove Locks'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: none
          - task: AzureCLI@2
            displayName: 'Remove locks'
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "Listing locks for the resource..."
                LOCK_IDS=$(az lock list --query "[].id" -o tsv)

                if [ -z "$LOCK_IDS" ]; then
                  echo "No locks found"
                  exit 0
                fi

                echo "Found locks:"
                echo "$LOCK_IDS"

                # Delete each lock
                for id in $LOCK_IDS; do
                  echo "Deleting lock $id"
                  az lock delete --ids "$id"
                done

                echo "Completed lock removal."
